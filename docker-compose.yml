services:
  # NATS with JetStream - Event backbone
  nats:
    image: nats:latest
    container_name: flux-nats
    command: ["-js", "-m", "8223", "-sd", "/data"]
    ports:
      - "4223:4222"  # Client port (using 4223 to avoid conflict with flux-reactor)
      - "8223:8223"  # Monitoring port
    volumes:
      - nats-data:/data
    networks:
      - flux-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # Flux Service - State engine + APIs
  flux:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flux
    environment:
      - NATS_URL=nats://nats:4222
      - PORT=3000
      - FLUX_ENCRYPTION_KEY=${FLUX_ENCRYPTION_KEY}
      - FLUX_CREDENTIALS_DB=/data/credentials.db
      - FLUX_OAUTH_GITHUB_CLIENT_ID=${FLUX_OAUTH_GITHUB_CLIENT_ID}
      - FLUX_OAUTH_GITHUB_CLIENT_SECRET=${FLUX_OAUTH_GITHUB_CLIENT_SECRET}
      - FLUX_OAUTH_CALLBACK_BASE_URL=${FLUX_OAUTH_CALLBACK_BASE_URL}
      - FLUX_AUTH_ENABLED=${FLUX_AUTH_ENABLED}
      - FLUX_ADMIN_TOKEN=${FLUX_ADMIN_TOKEN}
      - FLUX_NAMESPACE_DB=/data/namespaces.db
      # Added 2026-09-09: flux::api::ingestion logged INFO per event (~10 eps),
      # which reached /var/log/syslog via the foreground `docker compose up` and
      # grew it ~900 MB/day. Ingestion errors still surface at ERROR.
      - RUST_LOG=flux=info,flux::api::ingestion=warn
    volumes:
      - ./data:/data
    ports:
      - "3000:3000"
    networks:
      - flux-network
    depends_on:
      - nats
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 8G

  # Connector Manager - Runs scheduled connectors (GitHub, etc.)
  connector-manager:
    build:
      context: .
      dockerfile: connector-manager/Dockerfile
    container_name: connector-manager
    environment:
      - FLUX_API_URL=http://flux:3000
      - FLUX_ENCRYPTION_KEY=${FLUX_ENCRYPTION_KEY}
      - FLUX_CREDENTIALS_DB=/data/credentials.db
      - GENERIC_CONFIG_DB=/data/generic_config.db
      - NAMED_CONFIG_DB=/data/named_config.db
    volumes:
      - ./data:/data
    # ADR-013: loopback only. Reachable via `curl localhost:3001` over SSH, never
    # from the LAN or the tunnel. connector-manager has NO authentication of its own
    # (api.rs:406) and its Singer runner spawns tap_name as a command — until that
    # changes, loopback is the boundary.
    ports:
      - "127.0.0.1:3001:3001"
    networks:
      - flux-network
    depends_on:
      - flux
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

networks:
  flux-network:
    driver: bridge

volumes:
  nats-data:
